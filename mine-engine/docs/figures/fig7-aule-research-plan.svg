<svg viewBox="0 0 680 844" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
<title>AuLE 科研方案图：审计被审的判分器</title>
<desc>从社区缺口出发，给出构造侧/审计侧/后果侧三层方法，附S1 真实 judge 实测证据（GO）、对 DataFlow-Agent 的交付形态、五步路线图与诚实边界。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
text{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.c-b{stroke:#185FA5}.f-b{fill:#E6F1FB}
.c-p{stroke:#534AB7}.f-p{fill:#EEEDFE}
.c-t{stroke:#0F6E56}.f-t{fill:#E1F5EE}
.c-a{stroke:#854F0B}.f-a{fill:#FAEEDA}
.c-g{stroke:#3B6D11}.f-g{fill:#EAF3DE}
.c-y{stroke:#5F5E5A}.f-y{fill:#F1EFE8}
.nd{fill:#FFFFFF;stroke-width:0.5}
.pri{fill:#2C2C2A}.sec{fill:#5F5E5A}
</style>

<rect class="f-a" x="40" y="40" width="600" height="72" rx="12" stroke="#854F0B" stroke-width="0.5"/>
<text x="56" y="60" font-size="14" font-weight="500" class="pri" dominant-baseline="central">主张：给 verifier 配一个独立的参照 oracle</text>
<text x="56" y="80" font-size="12" class="sec" dominant-baseline="central">verifier 的可靠性是 RL 训练的隐藏瓶颈；而它可以在零人工标注下被测量</text>
<text x="56" y="98" font-size="12" fill="#854F0B" dominant-baseline="central">前提：参照 oracle 由构造写定，与被审 verifier 不共享任何代码或模型</text>
<path d="M340 116L340 138" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect class="f-b" x="40" y="144" width="180" height="208" rx="12" stroke="#185FA5" stroke-width="0.5"/>
<text x="130" y="164" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" dominant-baseline="central">① 构造侧</text>
<rect class="nd c-b" x="56" y="176" width="148" height="44" rx="8"/>
<text x="130" y="194" text-anchor="middle" font-size="13" font-weight="500" class="pri" dominant-baseline="central">种子账套</text>
<text x="130" y="210" text-anchor="middle" font-size="12" class="sec" dominant-baseline="central">恒等式天然自平</text>
<path d="M130 224L130 230" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect class="nd c-b" x="56" y="234" width="148" height="44" rx="8"/>
<text x="130" y="252" text-anchor="middle" font-size="13" font-weight="500" class="pri" dominant-baseline="central">注入算子</text>
<text x="130" y="268" text-anchor="middle" font-size="12" class="sec" dominant-baseline="central">4 类舞弊手法</text>
<path d="M130 282L130 288" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect class="nd c-b" x="56" y="292" width="148" height="44" rx="8"/>
<text x="130" y="310" text-anchor="middle" font-size="13" font-weight="500" class="pri" dominant-baseline="central">任务自带参照</text>
<text x="130" y="326" text-anchor="middle" font-size="12" class="sec" dominant-baseline="central">答案由动作写定</text>

<rect class="f-p" x="250" y="144" width="180" height="208" rx="12" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="164" text-anchor="middle" font-size="14" font-weight="500" fill="#26215C" dominant-baseline="central">② 审计侧</text>
<rect class="nd c-p" x="266" y="176" width="148" height="44" rx="8"/>
<text x="340" y="194" text-anchor="middle" font-size="13" font-weight="500" class="pri" dominant-baseline="central">待审 verifier</text>
<text x="340" y="210" text-anchor="middle" font-size="12" class="sec" dominant-baseline="central">含 LLM-as-judge</text>
<path d="M340 224L340 230" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect class="nd c-p" x="266" y="234" width="148" height="44" rx="8"/>
<text x="340" y="252" text-anchor="middle" font-size="13" font-weight="500" class="pri" dominant-baseline="central">分层判定</text>
<text x="340" y="268" text-anchor="middle" font-size="12" class="sec" dominant-baseline="central">检测层 / 归因层拆开</text>
<path d="M340 282L340 288" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect class="nd c-p" x="266" y="292" width="148" height="44" rx="8"/>
<text x="340" y="310" text-anchor="middle" font-size="13" font-weight="500" class="pri" dominant-baseline="central">误差预算三列</text>
<text x="340" y="326" text-anchor="middle" font-size="12" class="sec" dominant-baseline="central">FNR · FPR · 不可见</text>

<rect class="f-t" x="460" y="144" width="180" height="208" rx="12" stroke="#0F6E56" stroke-width="0.5"/>
<text x="550" y="164" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C" dominant-baseline="central">③ 后果侧</text>
<rect class="nd c-t" x="476" y="176" width="148" height="44" rx="8"/>
<text x="550" y="194" text-anchor="middle" font-size="13" font-weight="500" class="pri" dominant-baseline="central">误差预算输入</text>
<text x="550" y="210" text-anchor="middle" font-size="12" class="sec" dominant-baseline="central">(FNR, FPR) 二元组</text>
<path d="M550 224L550 230" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect class="nd c-t" x="476" y="234" width="148" height="44" rx="8"/>
<text x="550" y="252" text-anchor="middle" font-size="13" font-weight="500" class="pri" dominant-baseline="central">闭式 + 蒙特卡洛</text>
<text x="550" y="268" text-anchor="middle" font-size="12" class="sec" dominant-baseline="central">偏差 &gt; 0.15 即报警</text>
<path d="M550 282L550 288" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect class="nd c-t" x="476" y="292" width="148" height="44" rx="8"/>
<text x="550" y="310" text-anchor="middle" font-size="13" font-weight="500" class="pri" dominant-baseline="central">三种失效形态</text>
<text x="550" y="326" text-anchor="middle" font-size="12" class="sec" dominant-baseline="central">翻转·退化·不可见</text>

<path d="M224 314L246 314" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M434 314L456 314" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="40" y="378" font-size="13" font-weight="500" class="pri" dominant-baseline="central">已验证（S1 实测，判据跑前写死：最宽松 arm C 端到端 FNR* ≥ 0.20 → 继续）</text>
<rect class="f-g" x="40" y="388" width="600" height="104" rx="12" stroke="#3B6D11" stroke-width="0.5"/>
<text x="56" y="406" font-size="12" fill="#3B6D11" dominant-baseline="central">两个模型都判 GO，且失败方式相反 —— 能力提升只买到检测，没买到归因</text>
<rect x="56" y="416" width="131" height="64" rx="8" fill="#FFFFFF" stroke="#97C459" stroke-width="0.5"/>
<text x="121" y="434" text-anchor="middle" font-size="15" font-weight="500" fill="#173404" dominant-baseline="central">0.500</text>
<text x="121" y="452" text-anchor="middle" font-size="11" class="sec" dominant-baseline="central">flash 端到端 FNR</text>
<text x="121" y="467" text-anchor="middle" font-size="11" class="sec" dominant-baseline="central">CI [0.423, 0.577]</text>
<rect x="201" y="416" width="131" height="64" rx="8" fill="#FFFFFF" stroke="#97C459" stroke-width="0.5"/>
<text x="266" y="434" text-anchor="middle" font-size="15" font-weight="500" fill="#173404" dominant-baseline="central">0.380</text>
<text x="266" y="452" text-anchor="middle" font-size="11" class="sec" dominant-baseline="central">v4-pro 端到端 FNR</text>
<text x="266" y="467" text-anchor="middle" font-size="11" class="sec" dominant-baseline="central">CI [0.291, 0.478]</text>
<rect x="346" y="416" width="131" height="64" rx="8" fill="#FFFFFF" stroke="#97C459" stroke-width="0.5"/>
<text x="411" y="434" text-anchor="middle" font-size="15" font-weight="500" fill="#173404" dominant-baseline="central">54.6%</text>
<text x="411" y="452" text-anchor="middle" font-size="11" class="sec" dominant-baseline="central">报警被自己的</text>
<text x="411" y="467" text-anchor="middle" font-size="11" class="sec" dominant-baseline="central">理由否定（arm B）</text>
<rect x="491" y="416" width="131" height="64" rx="8" fill="#FFFFFF" stroke="#97C459" stroke-width="0.5"/>
<text x="556" y="434" text-anchor="middle" font-size="15" font-weight="500" fill="#173404" dominant-baseline="central">1.5–24%</text>
<text x="556" y="452" text-anchor="middle" font-size="11" class="sec" dominant-baseline="central">重复调用的</text>
<text x="556" y="467" text-anchor="middle" font-size="11" class="sec" dominant-baseline="central">判定分歧率</text>
<path d="M340 496L340 508" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="40" y="528" font-size="13" font-weight="500" class="pri" dominant-baseline="central">交付形态：插进 DataFlow-Agent 的算子层，不替换它已有的 L0–L5 设施</text>
<rect class="f-y" x="40" y="536" width="600" height="72" rx="12" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="56" y="556" font-size="12" class="pri" dominant-baseline="central">VerifierAuditOperator —— 一个算子，不是又一个 judge</text>
<text x="56" y="574" font-size="12" class="sec" dominant-baseline="central">输入：一批轨迹 + 任务自带 verifier　　输出：(FNR, FPR, 退化组比例, 不可见清单)</text>
<text x="56" y="592" font-size="12" fill="#5F5E5A" dominant-baseline="central">关键区别：不卖「我给你一个更好的 judge」，卖「我告诉你现在这个 judge 有多差」</text>
<path d="M340 612L340 624" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="40" y="644" font-size="13" font-weight="500" class="pri" dominant-baseline="central">路线图（按能否证伪排序，不按工作量排序）</text>
<rect class="f-b" x="40" y="652" width="600" height="76" rx="12" stroke="#378ADD" stroke-width="0.5"/>
<rect x="56" y="678" width="131" height="38" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="121" y="690" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53" dominant-baseline="central">S2 组大小</text>
<text x="121" y="704" text-anchor="middle" font-size="11" class="sec" dominant-baseline="central">G∈{4,8,16,32}</text>
<rect x="201" y="678" width="131" height="38" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="266" y="690" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53" dominant-baseline="central">S3 verl 实跑</text>
<text x="266" y="704" text-anchor="middle" font-size="11" class="sec" dominant-baseline="central">真跑 GRPO 曲线</text>
<rect x="346" y="678" width="131" height="38" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="411" y="690" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53" dominant-baseline="central">S4 第二域</text>
<text x="411" y="704" text-anchor="middle" font-size="11" class="sec" dominant-baseline="central">验证是否普遍</text>
<rect x="491" y="678" width="131" height="38" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="556" y="690" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53" dominant-baseline="central">S5 盲审 κ</text>
<text x="556" y="704" text-anchor="middle" font-size="11" class="sec" dominant-baseline="central">2–3 名审计师</text>

<text x="40" y="748" font-size="13" font-weight="500" class="pri" dominant-baseline="central">诚实边界（这段决定能不能过审）</text>
<rect x="40" y="756" width="600" height="68" rx="12" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="56" y="776" font-size="12" class="sec" dominant-baseline="central">不新：RLVR 的重要性 / 误差的系统性 / 程序化 verifier 优于 LLM judge —— 均已有工作</text>
<text x="56" y="796" font-size="12" class="sec" dominant-baseline="central">可能新：审计的参照可构造 / 漏判 ≠ 翻转训练方向 / 无梯度退化作为独立的第三种失效</text>
</svg>