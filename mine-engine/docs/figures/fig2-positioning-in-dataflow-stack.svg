<svg viewBox="0 0 680 400" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>DataFlow 生态六层栈与 verifier rail 插入点</title>
<desc>纵向排列 DataFlow 生态 L0 到 L5 六层，右侧一条紫色 verifier rail 贯穿 L2 到 L4，对应三个插入包：dataflow-vts、HarborSandboxClient、VerifierJudger。</desc>
<defs>
