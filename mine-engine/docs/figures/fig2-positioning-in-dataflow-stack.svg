<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="26" font-family="var(--font-sans)" font-size="14" font-weight="500" fill="var(--color-text-primary)">DataFlow 生态六层栈 × 本课题的插入点</text>

