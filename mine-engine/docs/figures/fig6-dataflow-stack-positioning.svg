<svg viewBox="0 0 680 452" width="100%" xmlns="http://www.w3.org/2000/svg">
<title>Fig. 3 — 在 DataFlow 六层栈中的落点与交付形态</title>
<desc>不改动 DataFlow 现有设施，只在 L2 到 L4 插入一条 verifier 审计轨，交付一个算子。</desc>
<style>
text{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.mut{fill:#F1EFE8;stroke:#B4B2A9}
.own{fill:#EEEDFE;stroke:#7F77DD}
.ownl{fill:#F5F4FE;stroke:#AFA9EC}
.ship{fill:#E1F5EE;stroke:#1D9E75}
.tp{fill:#1F1F1E}
.ts{fill:#5F5E5A}
.tt{fill:#26215C}
</style>
<rect width="680" height="452" fill="#FFFFFF"/>

<text x="40" y="30" font-size="14" font-weight="500" class="tp">落点：不改动现有设施，只插入一条审计轨</text>
<text x="40" y="50" font-size="12" class="ts">灰色 = OpenDCAI 已有；紫色 = 本工作新增；绿色 = 可交付物。</text>

<rect class="mut" x="40" y="62" width="70" height="42" rx="8" stroke-width="0.5"/>
<text x="75" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" class="tp">L5</text>
<text x="75" y="93" text-anchor="middle" dominant-baseline="central" font-size="11" class="ts">Serving</text>
<rect class="mut" x="116" y="62" width="524" height="42" rx="8" stroke-width="0.5"/>
<text x="132" y="83" dominant-baseline="central" font-size="12" class="ts">数据服务与在线推理 —— 不涉及</text>

<rect class="mut" x="40" y="110" width="70" height="42" rx="8" stroke-width="0.5"/>
<text x="75" y="126" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" class="tp">L4</text>
<text x="75" y="141" text-anchor="middle" dominant-baseline="central" font-size="11" class="ts">Train</text>
<rect class="mut" x="116" y="110" width="250" height="42" rx="8" stroke-width="0.5"/>
<text x="132" y="131" dominant-baseline="central" font-size="12" class="ts">LLaMA-Factory · verl · DataFlex</text>
<rect class="own" x="372" y="110" width="268" height="42" rx="8" stroke-width="0.5"/>
<text x="388" y="126" dominant-baseline="central" font-size="12" font-weight="500" class="tp">审计轨：给定 (FNR, FPR) 预测训练失效</text>
<text x="388" y="141" dominant-baseline="central" font-size="11" class="ts">不必先跑 RL 才知道能不能训</text>

<rect class="mut" x="40" y="158" width="70" height="42" rx="8" stroke-width="0.5"/>
<text x="75" y="174" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" class="tp">L3</text>
<text x="75" y="189" text-anchor="middle" dominant-baseline="central" font-size="11" class="ts">Agent</text>
<rect class="mut" x="116" y="158" width="250" height="42" rx="8" stroke-width="0.5"/>
<text x="132" y="179" dominant-baseline="central" font-size="12" class="ts">AgentFlow · DataFlow-Agent · LoopAI</text>
<rect class="own" x="372" y="158" width="268" height="42" rx="8" stroke-width="0.5"/>
<text x="388" y="174" dominant-baseline="central" font-size="12" font-weight="500" class="tp">审计轨：给 LLM-as-judge 出误差预算</text>
<text x="388" y="189" dominant-baseline="central" font-size="11" class="ts">他们用四轴 1–5 分，我们量它有多差</text>

<rect class="mut" x="40" y="206" width="70" height="42" rx="8" stroke-width="0.5"/>
<text x="75" y="222" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" class="tp">L2</text>
<text x="75" y="237" text-anchor="middle" dominant-baseline="central" font-size="11" class="ts">Table</text>
<rect class="mut" x="116" y="206" width="250" height="42" rx="8" stroke-width="0.5"/>
<text x="132" y="227" dominant-baseline="central" font-size="12" class="ts">DataFlow-Table · ProfiliTable (SIGKDD 26)</text>
<rect class="own" x="372" y="206" width="268" height="42" rx="8" stroke-width="0.5"/>
<text x="388" y="222" dominant-baseline="central" font-size="12" font-weight="500" class="tp">审计轨：任务构造时附带的参照 oracle</text>
<text x="388" y="237" dominant-baseline="central" font-size="11" class="ts">账套由准则凭空生成，不涉密可公开</text>

<rect class="mut" x="40" y="254" width="70" height="42" rx="8" stroke-width="0.5"/>
<text x="75" y="270" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" class="tp">L1</text>
<text x="75" y="285" text-anchor="middle" dominant-baseline="central" font-size="11" class="ts">Pipeline</text>
<rect class="ownl" x="116" y="254" width="524" height="42" rx="8" stroke-width="0.5"/>
<text x="132" y="270" dominant-baseline="central" font-size="12" font-weight="500" class="tt">种子账套生成 → 舞弊注入算子 → 差分隔离证书 → 误差预算表</text>
<text x="132" y="285" dominant-baseline="central" font-size="11" class="ts">全部是纯函数，零外部依赖，审稿人可自行复现；每题核验 0.64 ms，与题数解耦</text>

<rect class="mut" x="40" y="302" width="70" height="42" rx="8" stroke-width="0.5"/>
<text x="75" y="318" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" class="tp">L0</text>
<text x="75" y="333" text-anchor="middle" dominant-baseline="central" font-size="11" class="ts">Storage</text>
<rect class="mut" x="116" y="302" width="524" height="42" rx="8" stroke-width="0.5"/>
<text x="132" y="323" dominant-baseline="central" font-size="12" class="ts">数据存储层 —— 暂不改动（第二阶段才需扩展以承载 verifier 代码）</text>

<text x="40" y="374" font-size="13" font-weight="500" class="tp">交付给合作方的一个算子</text>
<rect class="ship" x="40" y="386" width="600" height="50" rx="12" stroke-width="0.5"/>
<text x="60" y="406" dominant-baseline="central" font-size="13" font-weight="500" class="tp">VerifierAuditOperator —— 输入：一批轨迹 + 任务自带 verifier</text>
<text x="60" y="424" dominant-baseline="central" font-size="12" class="ts">输出：(FNR, FPR, 退化组比例, 结构性不可见清单, 系统性判定) ｜ 不需要任何人工标注</text>
</svg>