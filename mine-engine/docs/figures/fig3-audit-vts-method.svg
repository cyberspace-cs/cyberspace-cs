<svg viewBox="0 0 680 356" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>审计域可验证任务合成：一次注入同时产出题、答案与判分器</title>
<desc>
合法账套经舞弊注入算子变换后，同时输出三个产物：注入版账套给模型、构造性标签作为答案、勾稽复算程序作为判分器。</desc>
<!-- LEGACY: LEGACY | v3 时代（C 类是空白）。该主张已被 WebGrader/AutoPyVerifier/Pajama 证伪，此图仅保留作历史记录。 -->
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="26" font-family="var(--font-sans)" font-size="14" font-weight="500" fill="var(--color-text-primary)">审计域方法：一次注入，同时产出题 / 答案 / 判分器</text>

<rect x="205" y="56" width="270" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="76" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">seed ledger · 合法账套</text>
<text x="340" y="92" font-family="var(--font-sans)" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">6 条会计恒等式全部成立</text>

<path d="M340 104 V 122" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="205" y="124" width="270" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="144" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">舞弊注入算子 t(s, θ)</text>
<text x="340" y="161" font-family="var(--font-sans)" font-size="11" fill="#534AB7" text-anchor="middle" dominant-baseline="central">8 种真实手法 · θ 控制难度</text>

<path d="M340 176 V 192" fill="none" stroke="#534AB7" stroke-width="1.5"/>
<path d="M130 192 H 550" fill="none" stroke="#534AB7" stroke-width="1.5"/>
<path d="M130 192 V 202" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 192 V 202" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M550 192 V 202" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="204" width="180" height="68" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="130" y="222" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">task</text>
<text x="130" y="240" font-family="var(--font-sans)" font-size="11" fill="#534AB7" text-anchor="middle" dominant-baseline="central">注入版账套</text>
<text x="130" y="256" font-family="var(--font-sans)" font-size="11" fill="var(--color-text-tertiary)" text-anchor="middle" dominant-baseline="central">交给模型</text>

<rect x="250" y="204" width="180" height="68" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="222" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">label</text>
<text x="340" y="240" font-family="var(--font-sans)" font-size="11" fill="#534AB7" text-anchor="middle" dominant-baseline="central">手法 · 科目 · 期间 · 金额</text>
<text x="340" y="256" font-family="var(--font-sans)" font-size="11" fill="var(--color-text-tertiary)" text-anchor="middle" dominant-baseline="central">构造即正确</text>

<rect x="460" y="204" width="180" height="68" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="550" y="222" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">verifier</text>
<text x="550" y="240" font-family="var(--font-sans)" font-size="11" fill="#534AB7" text-anchor="middle" dominant-baseline="central">勾稽复算程序</text>
<text x="550" y="256" font-family="var(--font-sans)" font-size="11" fill="var(--color-text-tertiary)" text-anchor="middle" dominant-baseline="central">判定是否命中</text>

<rect x="40" y="296" width="600" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="316" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">三样东西由同一次注入产生 —— 答案不是判出来的，是造的时候写下来的</text>
</svg>
