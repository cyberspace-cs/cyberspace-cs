<svg viewBox="0 0 680 496" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
<title>AuLE research architecture: synthesize, execute, distill</title>
<desc>
A three-lane pipeline. Lane 1 synthesizes tasks by injecting transformations into verified seed programs and differentially verifying them. Lane 2 executes the task package in a Harbor container with an agent and runs the verifier to get an exact reward. Lane 3 distils trajectories plus rewards into training data and a benchmark using DataFlow operators. A dashed line shows the verifier and label travelling free from synthesis to execution.</desc>
