<svg viewBox="0 0 680 470" width="100%" xmlns="http://www.w3.org/2000/svg">
<title>Fig. 2 — 错误预算矩阵与结构性不可见</title>
<desc>四种舞弊手法的实际破坏集均为表账一致与递推，会计恒等式不与任一破坏集相交，导致只查恒等式的 verifier 恒定漏判 100%。</desc>
<style>
text{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.hd{fill:#F1EFE8;stroke:#B4B2A9}
.hit{fill:#E1F5EE;stroke:#1D9E75}
.dead{fill:#FCEBEB;stroke:#E24B4A}
.tp{fill:#1F1F1E}
.ts{fill:#5F5E5A}
.danger{fill:#A32D2D}
</style>
<rect width="680" height="470" fill="#FFFFFF"/>

<text x="40" y="32" font-size="14" font-weight="500" class="tp">错误预算矩阵 · 四个手法实测破坏集 × verifier 判据集</text>
<text x="40" y="52" font-size="12" class="ts">行 = 注入手法实际破坏的会计约束；列 = verifier 实际检查的判据。空格代表该 verifier 看不见该手法。</text>

<rect class="hd" x="40" y="66" width="200" height="34" rx="6" stroke-width="0.5"/>
<text x="140" y="83" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" class="tp">手法（注入的舞弊）</text>
<rect class="hd" x="244" y="66" width="112" height="34" rx="6" stroke-width="0.5"/>
<text x="300" y="77" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" class="tp">破坏集</text>
<text x="300" y="92" text-anchor="middle" dominant-baseline="central" font-size="11" class="ts">实测，非声明</text>
<rect class="hd" x="360" y="66" width="86" height="34" rx="6" stroke-width="0.5"/>
<text x="403" y="77" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" class="tp">恒等式</text>
<text x="403" y="92" text-anchor="middle" dominant-baseline="central" font-size="11" class="ts">o_equation</text>
<rect class="hd" x="450" y="66" width="86" height="34" rx="6" stroke-width="0.5"/>
<text x="493" y="77" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" class="tp">表账一致</text>
<text x="493" y="92" text-anchor="middle" dominant-baseline="central" font-size="11" class="ts">o_tie_detail</text>
<rect class="hd" x="540" y="66" width="100" height="34" rx="6" stroke-width="0.5"/>
<text x="590" y="77" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" class="tp">科目递推</text>
<text x="590" y="92" text-anchor="middle" dominant-baseline="central" font-size="11" class="ts">o_rollforward</text>

<rect class="hit" x="40" y="104" width="200" height="38" rx="6" stroke-width="0.5"/>
<text x="56" y="123" dominant-baseline="central" font-size="13" class="tp">费用资本化</text>
<rect class="hit" x="244" y="104" width="112" height="38" rx="6" stroke-width="0.5"/>
<text x="300" y="123" text-anchor="middle" dominant-baseline="central" font-size="11" class="tp">递推 + 表账</text>
<rect class="dead" x="360" y="104" width="86" height="38" rx="6" stroke-width="0.5"/>
<text x="403" y="123" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" class="danger">看不见</text>
<rect class="hit" x="450" y="104" width="86" height="38" rx="6" stroke-width="0.5"/>
<text x="493" y="123" text-anchor="middle" dominant-baseline="central" font-size="12" class="tp">可检出</text>
<rect class="hit" x="540" y="104" width="100" height="38" rx="6" stroke-width="0.5"/>
<text x="590" y="123" text-anchor="middle" dominant-baseline="central" font-size="12" class="tp">可检出</text>

<rect class="hit" x="40" y="146" width="200" height="38" rx="6" stroke-width="0.5"/>
<text x="56" y="165" dominant-baseline="central" font-size="13" class="tp">折旧计提不足</text>
<rect class="hit" x="244" y="146" width="112" height="38" rx="6" stroke-width="0.5"/>
<text x="300" y="165" text-anchor="middle" dominant-baseline="central" font-size="11" class="tp">递推 + 表账</text>
<rect class="dead" x="360" y="146" width="86" height="38" rx="6" stroke-width="0.5"/>
<text x="403" y="165" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" class="danger">看不见</text>
<rect class="hit" x="450" y="146" width="86" height="38" rx="6" stroke-width="0.5"/>
<text x="493" y="165" text-anchor="middle" dominant-baseline="central" font-size="12" class="tp">可检出</text>
<rect class="hit" x="540" y="146" width="100" height="38" rx="6" stroke-width="0.5"/>
<text x="590" y="165" text-anchor="middle" dominant-baseline="central" font-size="12" class="tp">可检出</text>

<rect class="hit" x="40" y="188" width="200" height="38" rx="6" stroke-width="0.5"/>
<text x="56" y="207" dominant-baseline="central" font-size="13" class="tp">跨期调节</text>
<rect class="hit" x="244" y="188" width="112" height="38" rx="6" stroke-width="0.5"/>
<text x="300" y="207" text-anchor="middle" dominant-baseline="central" font-size="11" class="tp">递推 + 表账</text>
<rect class="dead" x="360" y="188" width="86" height="38" rx="6" stroke-width="0.5"/>
<text x="403" y="207" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" class="danger">看不见</text>
<rect class="hit" x="450" y="188" width="86" height="38" rx="6" stroke-width="0.5"/>
<text x="493" y="207" text-anchor="middle" dominant-baseline="central" font-size="12" class="tp">可检出</text>
<rect class="hit" x="540" y="188" width="100" height="38" rx="6" stroke-width="0.5"/>
<text x="590" y="207" text-anchor="middle" dominant-baseline="central" font-size="12" class="tp">可检出</text>

<rect class="hit" x="40" y="230" width="200" height="38" rx="6" stroke-width="0.5"/>
<text x="56" y="249" dominant-baseline="central" font-size="13" class="tp">账外账 / 体外循环</text>
<rect class="hit" x="244" y="230" width="112" height="38" rx="6" stroke-width="0.5"/>
<text x="300" y="249" text-anchor="middle" dominant-baseline="central" font-size="11" class="tp">递推 + 表账</text>
<rect class="dead" x="360" y="230" width="86" height="38" rx="6" stroke-width="0.5"/>
<text x="403" y="249" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" class="danger">看不见</text>
<rect class="hit" x="450" y="230" width="86" height="38" rx="6" stroke-width="0.5"/>
<text x="493" y="249" text-anchor="middle" dominant-baseline="central" font-size="12" class="tp">可检出</text>
<rect class="hit" x="540" y="230" width="100" height="38" rx="6" stroke-width="0.5"/>
<text x="590" y="249" text-anchor="middle" dominant-baseline="central" font-size="12" class="tp">可检出</text>

<text x="40" y="296" font-size="13" font-weight="500" class="tp">由此得到的 verifier 误差预算（端到端 FNR，实测非估计）</text>

<rect class="hd" x="40" y="308" width="190" height="30" rx="6" stroke-width="0.5"/>
<text x="135" y="323" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" class="tp">verifier</text>
<rect class="hd" x="234" y="308" width="92" height="30" rx="6" stroke-width="0.5"/>
<text x="280" y="323" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" class="tp">FNR</text>
<rect class="hd" x="330" y="308" width="92" height="30" rx="6" stroke-width="0.5"/>
<text x="376" y="323" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" class="tp">正确解优势</text>
<rect class="hd" x="426" y="308" width="92" height="30" rx="6" stroke-width="0.5"/>
<text x="472" y="323" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" class="tp">退化组比例</text>
<rect class="hd" x="522" y="308" width="118" height="30" rx="6" stroke-width="0.5"/>
<text x="581" y="323" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" class="tp">判定</text>

<rect class="dead" x="40" y="342" width="190" height="32" rx="6" stroke-width="0.5"/>
<text x="135" y="358" text-anchor="middle" dominant-baseline="central" font-size="13" class="tp">只查会计恒等式</text>
<text x="280" y="358" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" class="danger">1.000</text>
<text x="376" y="358" text-anchor="middle" dominant-baseline="central" font-size="13" class="tp">0.000</text>
<text x="472" y="358" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" class="danger">100%</text>
<text x="581" y="358" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" class="tp">完全无梯度</text>

<rect class="hit" x="40" y="378" width="190" height="32" rx="6" stroke-width="0.5"/>
<text x="135" y="394" text-anchor="middle" dominant-baseline="central" font-size="13" class="tp">四条判据全查</text>
<text x="280" y="394" text-anchor="middle" dominant-baseline="central" font-size="13" class="tp">0.833</text>
<text x="376" y="394" text-anchor="middle" dominant-baseline="central" font-size="13" class="tp">0.225</text>
<text x="472" y="394" text-anchor="middle" dominant-baseline="central" font-size="13" class="tp">48.2%</text>
<text x="581" y="394" text-anchor="middle" dominant-baseline="central" font-size="12" class="tp">可训练但浪费</text>

<rect class="hit" x="40" y="414" width="190" height="32" rx="6" stroke-width="0.5"/>
<text x="135" y="430" text-anchor="middle" dominant-baseline="central" font-size="13" class="tp">只看报表勾稽（表账一致）</text>
<text x="280" y="430" text-anchor="middle" dominant-baseline="central" font-size="13" class="tp">0.833</text>
<text x="376" y="430" text-anchor="middle" dominant-baseline="central" font-size="13" class="tp">0.225</text>
<text x="472" y="430" text-anchor="middle" dominant-baseline="central" font-size="13" class="tp">48.2%</text>
<text x="581" y="430" text-anchor="middle" dominant-baseline="central" font-size="12" class="tp">与全查同分</text>

<text x="40" y="462" font-size="12" class="ts">加 oracle 不等于变可靠：先看破坏集与判据集是否相交，否则只是在加无效检查项。</text>
</svg>