# 本地一键起：MySQL8 + Redis7 + IM 服务
#   docker compose up -d
#   打开 http://localhost:8080/ 即可演示
services:
  mysql:
    image: mysql:8.0
    command: --default-time-zone=+08:00
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: im
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      HTTP_ADDR: ":8080"
      MYSQL_DSN: "root:rootpass@tcp(mysql:3306)/im?parseTime=true&charset=utf8mb4&loc=Local"
      REDIS_ADDR: "redis:6379"
      NODE_ID: "node-1"
      BIG_GROUP_THRESHOLD: "200"
      OFFLINE_RING_CAP: "30"
    ports:
      - "8080:8080"

volumes:
  mysql-data:
