<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cyberspace-cs · 飞书式 IM</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ==================== 登录 ==================== -->
<div id="login" class="login">
  <div class="login-card">
    <div class="login-brand">
      <div class="logo-lg">飞</div>
      <div>
        <h1>cyberspace-cs</h1>
        <p>飞书式 IM · 单条已读回执 · 扩散读 · 会话水位线</p>
      </div>
    </div>
    <div class="login-hint">选择一个身份登录（教学演示，免密码）</div>
    <input id="loginFilter" class="login-filter" placeholder="搜索姓名或部门">
    <div id="loginUsers" class="login-users"></div>
    <div class="login-foot">
      开两个窗口分别登录不同身份，即可看到「谁读了我的消息」
    </div>
  </div>
</div>

<!-- ==================== 主界面 ==================== -->
<div id="app" class="app" hidden>

  <!-- 顶部通栏：搜索居中，两侧是身份与通知 -->
  <header class="topbar">
    <div class="tb-brand"><span class="tb-mark">飞</span><span class="tb-name">cyberspace-cs</span></div>
    <div class="tb-search-wrap">
      <svg class="ic" viewBox="0 0 24 24"><path d="M10 3a7 7 0 1 0 4.2 12.6l4.5 4.5 1.4-1.4-4.5-4.5A7 7 0 0 0 10 3zm0 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10z"/></svg>
      <input id="globalSearch" placeholder="搜索消息、联系人、群组" autocomplete="off">
      <kbd>⌘K</kbd>
    </div>
    <div class="tb-right">
      <button class="tb-btn" id="notifyBtn" title="通知">
        <svg viewBox="0 0 24 24"><path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm7-6V11a7 7 0 1 0-14 0v5l-2 2v1h18v-1l-2-2z"/></svg>
        <i class="tb-dot" id="notifyDot" hidden></i>
      </button>
      <button class="tb-btn" id="newConvBtn" title="发起会话">
        <svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5z"/></svg>
      </button>
      <div class="tb-me" id="meAvatar" title="我的名片"></div>
    </div>
  </header>

  <div class="body">

    <!-- 左侧图标栏 -->
    <nav class="rail">
      <div class="rail-items">
        <button class="rail-item active" data-view="msg">
          <svg viewBox="0 0 24 24"><path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H9l-5 4V5a1 1 0 0 1 1-1z"/></svg>
          <span>消息</span><i class="rail-badge" id="railBadge" hidden></i>
        </button>
        <button class="rail-item" data-view="contacts">
          <svg viewBox="0 0 24 24"><path d="M8 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zm8 0a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2 20a6 6 0 0 1 12 0v1H2v-1zm12-1.6A7.6 7.6 0 0 1 22 21h-8v-2.6z"/></svg>
          <span>通讯录</span>
        </button>
        <button class="rail-item" data-view="docs">
          <svg viewBox="0 0 24 24"><path d="M6 2h8l4 4v16H6V2zm8 1.5V7h3.5L14 3.5zM8 11h8v1.6H8zm0 4h8v1.6H8z"/></svg>
          <span>云文档</span>
        </button>
        <button class="rail-item" data-view="calendar">
          <svg viewBox="0 0 24 24"><path d="M5 4h14a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm0 5h14M8 3v3m8-3v3M8 11h3v3H8z"/></svg>
          <span>日历</span>
        </button>
        <button class="rail-item" data-view="meeting">
          <svg viewBox="0 0 24 24"><path d="M3 6h13a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1zm15 3l4-2v10l-4-2V9z"/></svg>
          <span>会议</span>
        </button>
      </div>
      <div class="rail-bottom">
        <button class="rail-item" data-view="settings">
          <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 4a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L16 2H8l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 3 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L8 22h8l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>
          <span>设置</span>
        </button>
      </div>
    </nav>

    <!-- 消息页 -->
    <section class="view" id="viewMsg">
      <aside class="conv-col">
        <div class="conv-head">
          <div class="conv-tabs" id="convTabs">
            <button class="conv-tab active" data-tab="all">全部</button>
            <button class="conv-tab" data-tab="unread">未读<i class="tab-num" id="tabUnread" hidden></i></button>
            <button class="conv-tab" data-tab="at">@我<i class="tab-num" id="tabAt" hidden></i></button>
          </div>
          <button class="icon-btn" id="convMoreBtn" title="更多">
            <svg viewBox="0 0 24 24"><path d="M6 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>
          </button>
        </div>
        <div class="conv-list" id="convList"></div>
      </aside>

      <main class="chat" id="chatPane">
        <div class="chat-empty" id="chatEmpty">
          <div class="ce-art">
            <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="46" fill="#EAF0FF"/><path d="M40 46h40a4 4 0 0 1 4 4v26a4 4 0 0 1-4 4H58l-14 10V50a4 4 0 0 1 4-4z" fill="#3370FF" opacity=".9"/><circle cx="52" cy="64" r="3.4" fill="#fff"/><circle cx="62" cy="64" r="3.4" fill="#fff"/><circle cx="72" cy="64" r="3.4" fill="#fff"/></svg>
          </div>
          <h3>选择一个会话开始聊天</h3>
          <p>每条消息只存一份，未读靠水位线相减，已读回执只记「谁读了」</p>
        </div>

        <div class="chat-main" id="chatMain" hidden>
          <header class="chat-head">
            <div class="ch-left">
              <h2 id="chatName">—</h2>
              <div class="ch-meta" id="chatMeta"></div>
            </div>
            <div class="ch-right">
              <div class="head-avatars" id="headAvatars"></div>
              <button class="icon-btn" id="searchConvBtn" title="在会话中搜索">
                <svg viewBox="0 0 24 24"><path d="M10 3a7 7 0 1 0 4.2 12.6l4.5 4.5 1.4-1.4-4.5-4.5A7 7 0 0 0 10 3zm0 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10z"/></svg>
              </button>
              <button class="icon-btn" id="infoBtn" title="会话信息">
                <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
              </button>
            </div>
          </header>

          <div class="chat-scroll" id="messages"></div>
          <div class="typing-bar" id="typingBar" hidden></div>

          <div class="composer">
            <div class="reply-strip" id="replyStrip" hidden>
              <span class="rs-line"></span>
              <span class="rs-text" id="replyText"></span>
              <button class="rs-close" id="replyClose">✕</button>
            </div>
            <div class="composer-body">
              <textarea id="msgInput" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行" disabled></textarea>
              <div class="composer-tools">
                <button class="tool" id="emojiBtn" title="表情">😊</button>
                <button class="tool" id="atBtn" title="@ 提及">@</button>
                <button class="tool" id="uploadBtn" title="图片/文件">
                  <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5a4.5 4.5 0 0 1-9 0V6a3 3 0 0 1 6 0v10.5a1.5 1.5 0 0 1-3 0V7h-1.6v9.5a3.1 3.1 0 0 0 6.2 0V6a4.6 4.6 0 1 0-9.2 0v11.5a6.2 6.2 0 0 0 12.4 0V6h-1.8z"/></svg>
                </button>
                <button class="send-btn" id="sendBtn" disabled>发送</button>
              </div>
            </div>
            <div class="composer-tip" id="composerTip"></div>
          </div>
        </div>
      </main>

      <aside class="info-panel" id="infoPanel" hidden></aside>
    </section>

    <!-- 通讯录 -->
    <section class="view" id="viewContacts" hidden>
      <aside class="org-col">
        <div class="org-head">组织架构</div>
        <div class="org-tree" id="orgTree"></div>
      </aside>
      <main class="org-main">
        <div class="org-main-head">
          <h2 id="deptName">全部成员</h2>
          <span class="org-count" id="deptCount"></span>
        </div>
        <div class="org-grid" id="orgMembers"></div>
      </main>
    </section>

    <!-- 其余模块：保持诚实，不假装已实现 -->
    <section class="view placeholder-view" id="viewPlaceholder" hidden>
      <div class="ph-card">
        <div class="ph-icon" id="phIcon"></div>
        <h2 id="phTitle"></h2>
        <p id="phDesc"></p>
        <div class="ph-note">不在本期范围 · 后端接口已在 docs/feishu-benchmark.md 列出</div>
      </div>
    </section>

  </div>
</div>

<!-- ==================== 全局搜索面板 ==================== -->
<div id="searchPanel" class="search-panel" hidden>
  <div class="sp-head"><span id="spTitle">搜索</span><kbd>Esc 关闭</kbd></div>
  <div class="sp-body" id="spBody"></div>
</div>

<!-- ==================== 通知抽屉 ==================== -->
<div id="notifyPanel" class="drawer" hidden>
  <div class="drawer-head"><span>通知</span><button class="link-btn" id="notifyReadAll">全部已读</button></div>
  <div class="drawer-body" id="notifyList"></div>
</div>

<!-- ==================== 通用弹窗 ==================== -->
<div id="modal" class="modal" hidden>
  <div class="modal-card" id="modalCard">
    <div class="modal-head"><span id="modalTitle">标题</span><button class="icon-btn" id="modalClose">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- 右键菜单 -->
<div id="ctxMenu" class="ctx-menu" hidden></div>

<!-- 表情面板 -->
<div id="emojiPanel" class="emoji-panel" hidden></div>

<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
