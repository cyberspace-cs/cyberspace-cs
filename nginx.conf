# 部署在 taoxie.vip 的 Nginx 反代配置（把 /im 子路径代理到 IM 服务）。
# 用法：复制到 /etc/nginx/conf.d/im.conf 后 `nginx -t && systemctl reload nginx`
server {
    listen 80;
    server_name taoxie.vip;

    # /im/ 代理到本地 IM 服务；proxy_pass 末尾的 "/" 会剥掉 /im 前缀
    location /im/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;        # WebSocket 升级
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }
}
